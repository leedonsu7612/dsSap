spring:
  datasource:
    url: jdbc:h2:mem:dssap-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dssap.batch.entity,com.dssap.mybatis
  configuration:
    map-underscore-to-camel-case: true

sap:
  client: mock
  batch:
    enabled: false
    output-dir: ./target/batch-out
    page-size: 2
    chunk-size: 2
